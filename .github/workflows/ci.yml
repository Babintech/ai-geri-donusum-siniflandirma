name: CI — Temel Kontroller

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4
    
    - name: Python ${{ matrix.python-version }} ayarla
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Bağımlılıkları yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 pytest-cov
    
    - name: Python söz dizimi ve import kontrolü
      run: |
        python -m py_compile app.py classifier.py
        python -m py_compile src/inference/classifier.py
    
    - name: Linting — Temel stil kontrolleri
      continue-on-error: true
      run: |
        python -m flake8 app.py classifier.py src/ tests/ \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics
    
    - name: Testleri çalıştır
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Streamlit app başlatabilirliğini kontrol et
      continue-on-error: true
      run: |
        timeout 10 streamlit run app.py --logger.level=error || true
